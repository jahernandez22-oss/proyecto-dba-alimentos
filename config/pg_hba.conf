# =============================================================================
# pg_hba.conf ENDURECIDO - Alimentos del Valle
# Reemplaza por completo C:\BD\PostgreSQL\18\data\pg_hba.conf
#
# Como se lee: PostgreSQL revisa las lineas de ARRIBA hacia ABAJO y usa la PRIMERA
# que coincide con (tipo de conexion, base, usuario, IP). Si esa linea dice reject,
# se rechaza aunque mas abajo hubiera una que lo permitiera.
#
# Politica:
#   - Solo SCRAM-SHA-256 (nada de trust ni md5).
#   - postgres (superusuario) SOLO desde la propia maquina: es cuenta de emergencia.
#   - Las aplicaciones solo entran a alimentos_erp, solo desde el servidor de
#     aplicaciones (192.168.56.1) y solo cifradas (hostssl).
#   - Todo lo que no este escrito aqui se rechaza (ultima linea).
# Despues de editar:  SELECT pg_reload_conf();   y revisar:  SELECT * FROM pg_hba_file_rules;
# =============================================================================

# TYPE   DATABASE        USER                                   ADDRESS            METHOD

# 1) Superusuario: solo local; desde cualquier otra IP se rechaza de inmediato
host     all             postgres                               127.0.0.1/32       scram-sha-256
host     all             postgres                               ::1/128            scram-sha-256
host     all             postgres                               all                reject

# 2) Respaldos (pg_dump, pg_dumpall -g, pg_basebackup): solo local
host     alimentos_erp   respaldo                               127.0.0.1/32       scram-sha-256
host     alimentos_erp   respaldo                               ::1/128            scram-sha-256
host     postgres        respaldo                               127.0.0.1/32       scram-sha-256
host     postgres        respaldo                               ::1/128            scram-sha-256
host     replication     respaldo                               127.0.0.1/32       scram-sha-256
host     replication     respaldo                               ::1/128            scram-sha-256

# 3) DBAs con cuenta personal (miembros de rol_dba): local, o desde el anfitrion con TLS
host     all             +rol_dba                               127.0.0.1/32       scram-sha-256
host     all             +rol_dba                               ::1/128            scram-sha-256
hostssl  all             +rol_dba                               192.168.56.1/32    scram-sha-256

# 4) Aplicaciones: solo su base, solo desde el servidor de aplicaciones y cifradas
hostssl  alimentos_erp   app_ventas,app_reportes,rrhh_nomina,auditor_ti 192.168.56.1/32 scram-sha-256

# 5) Pruebas de las aplicaciones desde la propia VM
host     alimentos_erp   app_ventas,app_reportes,rrhh_nomina,auditor_ti 127.0.0.1/32    scram-sha-256
host     alimentos_erp   app_ventas,app_reportes,rrhh_nomina,auditor_ti ::1/128         scram-sha-256

# 6) Todo lo demas: rechazado (incluye conexiones sin TLS desde la red)
host     all             all                                    all                reject
