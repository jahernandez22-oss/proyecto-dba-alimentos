#==============================================================================
# BLOQUE DE HARDENING - Alimentos del Valle (equipo DBA)
#
# COMO SE USA: copiar este bloque completo AL FINAL de
#   C:\BD\PostgreSQL\18\data\postgresql.conf
# PostgreSQL toma el ULTIMO valor de cada parametro, asi que este bloque manda
# sobre los valores originales sin tener que buscarlos uno por uno.
# Cada fase descomenta su seccion. Para el ZIP final se copia el postgresql.conf
# completo a la carpeta /config.
#
# Cambios que requieren REINICIAR el servicio: listen_addresses, port, ssl (primera
# vez), logging_collector, shared_preload_libraries, wal_level, archive_mode.
# Los demas se aplican con:  SELECT pg_reload_conf();
#==============================================================================

#------------------------------------------------------------------------------
# FASE 1 - Red, autenticacion y cifrado en transito
#------------------------------------------------------------------------------
# Solo las interfaces propias: localhost y la IP fija de la VM. Nunca '*'.
listen_addresses = 'localhost,192.168.56.10'
# Fuera del puerto por defecto: reduce el ruido de bots que solo prueban 5432.
port = 15432
max_connections = 100
superuser_reserved_connections = 3
# Contrasenas con SCRAM-SHA-256 (MD5 es debil y PostgreSQL 18 ya lo desaconseja).
password_encryption = 'scram-sha-256'
# Corta rapido los intentos de autenticacion lentos (fuerza bruta, conexiones colgadas).
authentication_timeout = '30s'
# TLS: server.crt y server.key van en la carpeta de datos (ver Guia 1, carril Isaac).
ssl = on
ssl_cert_file = 'server.crt'
ssl_key_file = 'server.key'
ssl_min_protocol_version = 'TLSv1.2'

#------------------------------------------------------------------------------
# FASE 2 - Bitacoras nativas con filtros y rotacion (descomentar en la Guia 2)
#------------------------------------------------------------------------------
#logging_collector = on
# Mensajes del log en ingles: los patrones de los scripts (y herramientas como pgBadger) los entienden.
#lc_messages = 'C'
# Archivo propio + copia en el Visor de eventos (Registros de Windows > Aplicacion).
#log_destination = 'stderr,eventlog'
#event_source = 'PostgreSQL'
#log_directory = 'log'
# Un archivo por dia de la semana que se sobrescribe a los 7 dias: el disco no se satura.
#log_filename = 'postgresql-%a.log'
#log_truncate_on_rotation = on
#log_rotation_age = '1d'
#log_rotation_size = '100MB'
# Cada linea dice cuando, proceso, usuario, base, IP de origen y aplicacion.
#log_line_prefix = '%m [%p] usuario=%u base=%d cliente=%h app=%a '
# Conexiones y desconexiones (en PostgreSQL 18, on = receipt,authentication,authorization).
#log_connections = on
#log_disconnections = on
# DDL: CREATE, ALTER, DROP, incluidos ALTER ROLE (cambios de contrasena) y GRANT/REVOKE.
#log_statement = 'ddl'
# Consultas lentas (sirve de evidencia en la Fase 3).
#log_min_duration_statement = '2s'
#log_lock_waits = on
#log_checkpoints = on

#------------------------------------------------------------------------------
# FASE 3 - Estadisticas de consultas (descomentar en la Guia 3; requiere reinicio)
#------------------------------------------------------------------------------
#shared_preload_libraries = 'pg_stat_statements'
#pg_stat_statements.track = 'top'
#track_io_timing = on
# Costos del planificador para disco SSD: con el valor por defecto (4.0, pensado para discos
# mecanicos) el planificador subestima los indices y prefiere leer tablas completas.
#random_page_cost = 1.1
# Memoria que el sistema operativo usa como cache de disco (~50 % de la RAM de la VM).
#effective_cache_size = '3GB'

#------------------------------------------------------------------------------
# FASE 4 - Archivado de WAL para recuperar a un punto en el tiempo (Guia 4)
# Ajustar la ruta si los respaldos estan en C:\Respaldos en lugar de E:\Respaldos.
# En este archivo las diagonales invertidas se escriben dobles.
#------------------------------------------------------------------------------
#wal_level = replica
#archive_mode = on
#archive_command = 'copy "%p" "E:\\Respaldos\\wal\\%f"'
#archive_timeout = '15min'
