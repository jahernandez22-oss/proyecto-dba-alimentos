# =============================================================================
# mongod.cfg ENDURECIDO - Alimentos del Valle (MongoDB Enterprise 8.0 en Windows)
# Reemplaza C:\Program Files\MongoDB\Server\8.0\bin\mongod.cfg y reinicia el servicio:
#   Restart-Service MongoDB
# YAML: la sangria es con ESPACIOS (nunca tabuladores) y cuenta para el significado.
# =============================================================================

storage:
  dbPath: C:\BD\MongoDB\data

systemLog:
  destination: file
  path: C:\BD\MongoDB\log\mongod.log
  logAppend: true
  # Al rotar (db.adminCommand({ logRotate: 1 })) renombra el archivo con fecha y abre uno nuevo
  logRotate: rename

net:
  # Fuera del puerto por defecto 27017
  port: 37017
  # Solo localhost y la IP fija de la VM. Nunca 0.0.0.0 ni bindIpAll.
  bindIp: 127.0.0.1,192.168.56.10
  maxIncomingConnections: 200

security:
  # Sin esta linea MongoDB acepta a cualquiera sin usuario ni contrasena
  authorization: enabled
  # Llave compartida del conjunto de replicas (tambien activa la autenticacion interna)
  keyFile: C:\BD\MongoDB\seguridad\mongo.key
  # Apaga JavaScript del lado del servidor: $where, $function, $accumulator y mapReduce.
  # Es la puerta clasica de la inyeccion NoSQL con codigo.
  javascriptEnabled: false

replication:
  # Conjunto de replicas de UN nodo: da el oplog, que permite respaldos consistentes
  # (mongodump --oplog) y recuperar hasta un punto en el tiempo.
  replSetName: rs_alimentos
  oplogSizeMB: 2048

